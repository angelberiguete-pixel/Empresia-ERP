name: Import Dolibarr source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download upstream source
        run: |
          git clone --depth 1 https://github.com/Dolibarr/dolibarr.git /tmp/dolibarr-upstream
          mkdir -p dolibarr
          rsync -a --delete --exclude='.git' /tmp/dolibarr-upstream/ dolibarr/
          git -C /tmp/dolibarr-upstream rev-parse HEAD > dolibarr-upstream-commit.txt
      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dolibarr dolibarr-upstream-commit.txt
          if ! git diff --cached --quiet; then
            git commit -m "vendor: import Dolibarr upstream source"
            git push origin HEAD:main
          fi
