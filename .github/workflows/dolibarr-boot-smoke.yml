name: Empresia ERP Docker boot proof
on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - '.env.example'
      - 'docs/INSTALLATION.md'
      - '.github/workflows/dolibarr-boot-smoke.yml'
  push:
    branches:
      - 'test/dolibarr-docker-staging-20261109'
jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral staging secrets (not logged)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'DB_NAME=empresia_ci\nDB_USER=empresia_ci\n'
            printf 'DB_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'DOLI_ADMIN_LOGIN=empresia_ci_admin\n'
            printf 'DOLI_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'DOLI_INSTANCE_UNIQUE_ID=%s\n' "$(openssl rand -hex 24)"
            printf 'DOLI_URL_ROOT=http://localhost:8080\nDOLI_HOST_PORT=8080\n'
            printf 'DOLIBARR_IMAGE=dolibarr/dolibarr:latest\n'
            printf 'ODOO_DB_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'ODOO_IMAGE=odoo:20.0-20261102\nODOO_HOST_PORT=8069\n'
          } > .env
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Start official Odoo and Dolibarr with their isolated databases and volumes
        run: docker compose up -d --wait --wait-timeout 300
      - name: Initialize the empty Odoo 20 database exactly once
        shell: bash
        run: |
          set -euo pipefail
          # A fresh Postgres database has no Odoo registry until "base" is installed.
          # Ephemeral CI secrets only. Never run this against production data.
          docker compose run --rm --no-deps odoo \
            --database empresia_odoo --init base --stop-after-init --without-demo=all
          docker compose restart odoo
      - name: Verify real local web service without customer data
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 55); do
            if curl --silent --show-error --fail --location --max-time 5 \
              -o /dev/null http://127.0.0.1:8080/ 2>/dev/null; then
              ready=1
              break
            fi
            sleep 4
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: Dolibarr web service did not become reachable."
            docker compose ps
            exit 1
          fi
          echo "PASS: real Dolibarr container and MariaDB are responding locally."
          docker compose ps
      - name: Verify real Odoo HTTP endpoint without customer data
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 60); do
            if curl --silent --show-error --fail --max-time 5 \
              -o /dev/null http://127.0.0.1:8069/web/version 2>/dev/null; then
              ready=1
              break
            fi
            sleep 4
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: Odoo 20 did not expose its web version endpoint."
            docker compose ps
            docker compose logs --tail 75 odoo
            exit 1
          fi
          echo "PASS: Odoo 20 runtime is answering from isolated PostgreSQL-backed container."
      - name: Verify service survives restart without erasing volumes
        shell: bash
        run: |
          set -euo pipefail
          docker compose restart dolibarr
          ready=0
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail --location --max-time 5 \
              -o /dev/null http://127.0.0.1:8080/ 2>/dev/null; then
              ready=1
              break
            fi
            sleep 4
          done
          test "$ready" -eq 1
          echo "PASS: ERP web service recovered after a container restart."
      - name: Stop without deleting volumes
        if: always()
        run: docker compose down || true
